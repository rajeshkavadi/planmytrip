name: Build Windows EXE

# Builds PlanMyTrip.exe on a real Windows runner and publishes it to a GitHub
# Release, so you can download the .exe directly without building locally.

on:
  push:
    branches:
      - "claude/travel-planning-app-design-q6qhn7"
      - "main"
  workflow_dispatch:        # also runnable manually from the Actions tab

permissions:
  contents: write           # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build the executable
        run: pyinstaller --clean --noconfirm PlanMyTrip.spec

      - name: Verify the exe exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PlanMyTrip.exe")) { throw "dist/PlanMyTrip.exe was not produced" }
          Get-Item "dist/PlanMyTrip.exe" | Select-Object Name, Length

      # Always available (per-run, logged-in download, ~90 day retention)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlanMyTrip-exe
          path: dist/PlanMyTrip.exe

      # Stable, public-per-repo download page; a fresh release per push
      - name: Publish to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PlanMyTrip build ${{ github.run_number }}
          body: |
            Automated Windows build of PlanMyTrip.
            Commit: ${{ github.sha }}

            Download **PlanMyTrip.exe** below and double-click to run
            (opens http://localhost:8000/). Windows SmartScreen may warn about
            an unknown publisher — that is expected for an unsigned build:
            choose "More info" → "Run anyway".
          files: dist/PlanMyTrip.exe
          make_latest: true
