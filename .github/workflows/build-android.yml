name: Build Android APK

# Builds a self-contained (offline, on-device) Android APK and publishes it to
# a GitHub Release, so you can sideload it to your phone without a build setup.

on:
  push:
    branches:
      - "claude/travel-planning-app-design-q6qhn7"
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PlanMyTrip.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlanMyTrip-apk
          path: PlanMyTrip.apk

      - name: Publish to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: PlanMyTrip Android ${{ github.run_number }}
          body: |
            Offline Android build of PlanMyTrip (all data on-device — no server needed).
            Commit: ${{ github.sha }}

            To install: download **PlanMyTrip.apk** on your phone, then open it.
            Android will ask you to allow installing from your browser/Files app
            ("Install unknown apps") — this is an unsigned debug build, so that
            warning is expected. Flights/hotels are on-device sample data.
          files: PlanMyTrip.apk
          make_latest: false
