services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: planmytrip
      POSTGRES_PASSWORD: planmytrip
      POSTGRES_DB: planmytrip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planmytrip"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://planmytrip:planmytrip@db:5432/planmytrip
      APP_ENV: development
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/code/app

volumes:
  pgdata:
